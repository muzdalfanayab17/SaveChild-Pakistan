<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report & Support</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <section class="report-section">

            <h1>Report a Safety Concern</h1>

            <p>
                If you have a child-safety concern, you can use this form
                to share the information with us.
            </p>

            <form id="reportForm">

                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="concern">Your Concern</label>
                <textarea id="concern" name="concern" rows="6"></textarea>

                <button type="submit">Submit Report</button>

            </form>
            <a href="index.html" class="back-home">← Back to Home</a>

            <div id="message"></div>

        </section>

    </main>

</body>

</html>
